%YAML 1.2
---
description: >-
  Apply the Linux RMI GPT creation workaround for platform-allocated tables.
  RMM_SRC must point to the local TF-RMM repository. Remove this layer once
  the Linux revision used by the CCA overlays includes the fix.

build:
  linux:
    prebuild:
      - linux_gpt_patch="${btvar:RMM_SRC}/tools/shrinkwrap/patches/linux-gpt-l1-create.patch"
      # Allow repeated builds, including Linux trees patched manually.
      # An incompatible patch must fail the build rather than be ignored.
      - |
        if ! git apply --reverse --check "$$linux_gpt_patch" 2>/dev/null; then
          git apply "$$linux_gpt_patch"
        fi
