%YAML 1.2
---
description: >-
  Apply the patch that passes max_vdev_num to RMI_REALM_CREATE.
  RMM_SRC must point to the local TF-RMM repository. Remove this layer once
  the Linux revision used by the CCA overlays includes the fix.

build:
  linux:
    prebuild:
      - linux_max_vdev_num_patch="${btvar:RMM_SRC}/tools/shrinkwrap/patches/linux_set-realm-max_num_vdevs.patch"
      # Allow repeated builds, including Linux trees patched manually.
      # An incompatible patch must fail the build rather than be ignored.
      - |
        if ! git apply --reverse --check "$$linux_max_vdev_num_patch" 2>/dev/null; then
          git apply "$$linux_max_vdev_num_patch"
        fi
