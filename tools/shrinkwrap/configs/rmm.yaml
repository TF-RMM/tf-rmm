%YAML 1.2
---
description: >-
  Overlay to build TF-RMM with standard build settings.
  In order to use this overlay, the RMM_SRC btvar must be defined containing
  the absolute path for the local TF-RMM repository.

  ``RMM_LOG_LEVEL`` overrides the default TF-RMM log level, and
  ``TFA_REVISION`` selects the TF-A SHA or branch for this RMM build.
  ``RMM_CONFIG``, ``RMM_TOOLCHAIN``, and ``RMM_SANITIZERS`` select the
  target platform, compiler toolchain, and enabled sanitizers. Set
  ``RMM_ALLOC_TRACKING_DATA`` to control whether EL3 allocates granule
  tracking metadata during RMM activation.

buildex:
  btvars:
    # Determines where the TF-RMM source root directory is
    RMM_SRC:
      type: path
      value: null

    # Determines the RMM Log level
    RMM_LOG_LEVEL:
      type: string
      value: '40'

    # Determines the RMM Configuration (a.k.a. platform) to build
    RMM_CONFIG:
      type: string
      value: 'fvp_defcfg'

    # Determines the RMM compiler toolchain
    # Shrinkwrap does not package LLVM in docker yet. Use local
    # LLVM toolchain by setting --runtime=null during LLVM build.
    RMM_TOOLCHAIN:
      type: string
      value: 'gnu'

    # Determines the RMM sanitizers to enable
    RMM_SANITIZERS:
      type: string
      value: ''

    # Control EL3 allocation of granule tracking metadata during RMM activation
    RMM_ALLOC_TRACKING_DATA:
      type: string
      value: 'ON'

    # Determines the branch or SHA to pull for TF-A which is suitable
    # for the current RMM
    TFA_REVISION:
      type: string
      value: master

build:
  rmm:
    sourcedir: ${btvar:RMM_SRC}
    params:
       -DLOG_LEVEL: ${btvar:RMM_LOG_LEVEL}
       -DRMM_CONFIG: ${btvar:RMM_CONFIG}
       -DRMM_TOOLCHAIN: ${btvar:RMM_TOOLCHAIN}
       -DRMM_SANITIZERS: ${btvar:RMM_SANITIZERS}
       -DRMM_ALLOC_TRACKING_DATA: ${btvar:RMM_ALLOC_TRACKING_DATA}

  tfa:
    repo:
      revision: ${btvar:TFA_REVISION}
    params:
      RMM_V1_COMPAT: 0
